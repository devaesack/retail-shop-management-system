{% extends 'base.html' %}

{% block content %}


<div class="min-h-screen bg-slate-100 py-10 px-4">

    <div class="max-w-3xl mx-auto">

        <!-- Page header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">Edit Product</h1>
                <p class="text-sm text-slate-500 mt-1">Update the details for this product</p>
            </div>

            <a href="/products"
               class="text-sm font-medium text-slate-600 hover:text-slate-900 transition">
                ← Back to Products
            </a>
        </div>

        <!-- Form card -->
        <div class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">

            <!-- Card top accent -->
            <div class="h-1.5 bg-gradient-to-r from-amber-400 to-yellow-500"></div>

            <form method="POST" class="p-8 space-y-6">

                <!-- Product Name -->
                <div>
                    <label for="product_name" class="block text-sm font-semibold text-slate-700 mb-2">
                        Product Name
                    </label>
                    <input
                        type="text"
                        id="product_name"
                        name="product_name"
                        value="{{ product[1] }}"
                        required
                        class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-800
                               focus:border-amber-500 focus:ring-2 focus:ring-amber-200 focus:outline-none
                               transition">
                </div>

                <!-- Category -->
                <div>
                    <label for="category" class="block text-sm font-semibold text-slate-700 mb-2">
                        Category
                    </label>
                    <input
                        type="text"
                        id="category"
                        name="category"
                        value="{{ product[2] }}"
                        class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-800
                               focus:border-amber-500 focus:ring-2 focus:ring-amber-200 focus:outline-none
                               transition">
                </div>

                <!-- Price & Stock side by side on larger screens -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <div>
                        <label for="price" class="block text-sm font-semibold text-slate-700 mb-2">
                            Price (₹)
                        </label>
                        <input
                            type="number"
                            id="price"
                            name="price"
                            step="0.01"
                            min="0"
                            value="{{ product[3] }}"
                            required
                            class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-800
                                   focus:border-amber-500 focus:ring-2 focus:ring-amber-200 focus:outline-none
                                   transition">
                    </div>

                    <div>
                        <label for="stock" class="block text-sm font-semibold text-slate-700 mb-2">
                            Stock
                        </label>
                        <input
                            type="number"
                            id="stock"
                            name="stock"
                            min="0"
                            value="{{ product[4] }}"
                            required
                            class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-800
                                   focus:border-amber-500 focus:ring-2 focus:ring-amber-200 focus:outline-none
                                   transition">
                    </div>

                </div>

                <!-- Actions -->
                <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 pt-4 border-t border-slate-200">

                    <a href="/products"
                       class="inline-flex justify-center items-center rounded-lg border border-slate-300 bg-white
                              px-6 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="inline-flex justify-center items-center rounded-lg bg-amber-500 px-6 py-3
                               text-sm font-semibold text-white shadow-sm hover:bg-amber-600
                               focus:outline-none focus:ring-2 focus:ring-amber-300 transition">
                        Update Product
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
