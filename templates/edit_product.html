{% extends 'base.html' %}

{% block content %}

<div class="container">

<div class="card p-4">

<h2>Edit Product</h2>

<hr>

<form method="POST">

<div class="mb-3">

<label>Product Name</label>

<input
type="text"
name="product_name"
value="{{ product[1] }}"
class="form-control">

</div>

<div class="mb-3">

<label>Category</label>

<input
type="text"
name="category"
value="{{ product[2] }}"
class="form-control">

</div>

<div class="mb-3">

<label>Price</label>

<input
type="number"
name="price"
value="{{ product[3] }}"
class="form-control">

</div>

<div class="mb-3">

<label>Stock</label>

<input
type="number"
name="stock"
value="{{ product[4] }}"
class="form-control">

</div>

<button
class="btn btn-warning">

Update Product

</button>

</form>

</div>

</div>

{% endblock %}
