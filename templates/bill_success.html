{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="card p-4">

        <h2 class="text-success">
            ✅ Sale Recorded Successfully
        </h2>

        <hr>

        <p>
            <strong>Customer:</strong>
            {{ customer_name }}
        </p>

        <p>
            <strong>Product:</strong>
            {{ product_name }}
        </p>

        <p>
            <strong>Quantity:</strong>
            {{ quantity }}
        </p>

        <p>
            <strong>Total Amount:</strong>
            ₹{{ total_amount }}
        </p>

        <br>

        <a
        href="/billing"
        class="btn btn-primary">

        New Bill

        </a>

        <a
        href="/sales_history"
        class="btn btn-success mt-3">

        Sales History

        </a>

    </div>

</div>

{% endblock %}
