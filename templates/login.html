<!DOCTYPE html>
<html lang="en">

<head>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nez Retail Shop Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
    
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-md">

        <!-- Login card -->
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

            <!-- Top accent -->
            <div class="h-1.5 bg-gradient-to-r from-blue-500 via-indigo-500 to-violet-500"></div>

            <div class="p-8">

                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="text-5xl mb-3">🏪</div>
                    <h1 class="text-2xl font-bold text-slate-800">RetailPro Management</h1>
                    <p class="text-sm text-slate-500 mt-1">Retail Shop Management System</p>
                </div>

                <!-- Server error (wrong credentials, etc.) -->
                {% if error %}
                <div id="server-error"
                     class="flex items-start gap-3 rounded-lg border border-red-200 bg-red-50 px-4 py-3 mb-6 text-sm text-red-700">
                    <svg class="h-5 w-5 flex-shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
                    </svg>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <form method="POST" id="loginForm" novalidate class="space-y-5">

                    <!-- Username -->
                    <div>
                        <label for="username" class="block text-sm font-semibold text-slate-700 mb-2">
                            Username
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                                </svg>
                            </span>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                autocomplete="username"
                                class="w-full rounded-lg border bg-white pl-11 pr-4 py-3 text-slate-800 placeholder-slate-400
                                       border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none transition">
                        </div>
                        <p id="username-error" class="hidden mt-2 text-sm text-red-600"></p>
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">
                            Password
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                                </svg>
                            </span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                class="w-full rounded-lg border bg-white pl-11 pr-12 py-3 text-slate-800 placeholder-slate-400
                                       border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none transition">
                            <button type="button" id="togglePassword"
                                    class="absolute inset-y-0 right-0 flex items-center pr-4 text-sm font-medium text-slate-500 hover:text-indigo-600 transition">
                                Show
                            </button>
                        </div>
                        <p id="password-error" class="hidden mt-2 text-sm text-red-600"></p>
                    </div>

                    <!-- Submit -->
                    <button
                        type="submit"
                        class="w-full rounded-lg bg-gradient-to-r from-indigo-600 to-blue-600 px-4 py-3
                               text-base font-semibold text-white shadow-md hover:from-indigo-700 hover:to-blue-700
                               focus:outline-none focus:ring-2 focus:ring-indigo-300 active:scale-[0.99] transition">
                        Login
                    </button>

                </form>

            </div>

            <!-- Footer -->
            <div class="bg-slate-50 border-t border-slate-200 px-8 py-4 text-center text-xs text-slate-500">
                Retail Shop Management System © 2026
            </div>

        </div>

    </div>

    <script>
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const usernameError = document.getElementById('username-error');
        const passwordError = document.getElementById('password-error');
        const togglePassword = document.getElementById('togglePassword');

        const inputClasses = {
            normal: ['border-slate-300', 'focus:border-indigo-500', 'focus:ring-indigo-200'],
            invalid: ['border-red-400', 'focus:border-red-500', 'focus:ring-red-200']
        };

        function setInvalid(input, errorEl, message) {
            input.classList.remove(...inputClasses.normal);
            input.classList.add(...inputClasses.invalid);
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }

        function clearInvalid(input, errorEl) {
            input.classList.remove(...inputClasses.invalid);
            input.classList.add(...inputClasses.normal);
            errorEl.textContent = '';
            errorEl.classList.add('hidden');
        }

        function validateUsername() {
            const value = usernameInput.value.trim();
            if (value === '') {
                setInvalid(usernameInput, usernameError, 'Username is required.');
                return false;
            }
            if (value.length < 3) {
                setInvalid(usernameInput, usernameError, 'Username must be at least 3 characters.');
                return false;
            }
            clearInvalid(usernameInput, usernameError);
            return true;
        }

        function validatePassword() {
            if (passwordInput.value === '') {
                setInvalid(passwordInput, passwordError, 'Password is required.');
                return false;
            }
            clearInvalid(passwordInput, passwordError);
            return true;
        }

        // Validate on submit
        form.addEventListener('submit', function (e) {
            const validUser = validateUsername();
            const validPass = validatePassword();
            if (!validUser || !validPass) {
                e.preventDefault();
                (validUser ? passwordInput : usernameInput).focus();
            }
        });

        // Clear errors as the user types
        usernameInput.addEventListener('input', () => {
            if (usernameError.classList.contains('hidden') === false) validateUsername();
        });
        passwordInput.addEventListener('input', () => {
            if (passwordError.classList.contains('hidden') === false) validatePassword();
        });

        // Show / hide password
        togglePassword.addEventListener('click', function () {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            togglePassword.textContent = isHidden ? 'Hide' : 'Show';
        });
    </script>

</body>
</html>
