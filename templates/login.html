<!DOCTYPE html>
<html>

<head>

    <title>Retail Shop Login</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="login-header">

            <h1>🏪 RetailPro Management</h1>

            <p>
                Retail Shop Management System
            </p>

        </div>

        <form method="POST">

            <div class="mb-3">

                <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Username"
                required>

            </div>

            <div class="mb-4">

                <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Password"
                required>

            </div>

            <button
            type="submit"
            class="login-btn">

                Login

            </button>

        </form>

        <div class="footer-text">

            Retail Shop Management System © 2026

        </div>

    </div>

</div>

{% if error %}

<div class="alert alert-danger">
    {{ error }}
</div>

{% endif %}

</body>
</html>
