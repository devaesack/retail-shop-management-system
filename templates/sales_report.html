<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100 min-h-screen font-sans text-slate-800">

    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-10">

        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 flex items-center justify-center gap-3">
                <span>📊</span> Sales Report
            </h1>
            <div class="mt-3 inline-flex items-center gap-2 bg-white/70 backdrop-blur px-4 py-2 rounded-full shadow-sm text-sm sm:text-base text-slate-600">
                <span class="font-medium">{{ start_date }}</span>
                <span class="text-slate-400">→</span>
                <span class="font-medium">{{ end_date }}</span>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- Total Revenue -->
            <div class="group bg-white rounded-2xl p-6 shadow-md hover:shadow-xl transition-all duration-300 hover:-translate-y-1 border border-slate-200 border-t-4 border-t-emerald-500">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500">Total Revenue</h2>
                    <div class="h-10 w-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">
                        ₹
                    </div>
                </div>
                <p class="text-3xl font-bold text-slate-900">₹{{ revenue }}</p>
            </div>

            <!-- Total Bills -->
            <div class="group bg-white rounded-2xl p-6 shadow-md hover:shadow-xl transition-all duration-300 hover:-translate-y-1 border border-slate-200 border-t-4 border-t-blue-500">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500">Total Bills</h2>
                    <div class="h-10 w-10 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center group-hover:scale-110 transition-transform">
                        🧾
                    </div>
                </div>
                <p class="text-3xl font-bold text-slate-900">{{ total_bills }}</p>
            </div>

            <!-- Products Sold -->
            <div class="group bg-white rounded-2xl p-6 shadow-md hover:shadow-xl transition-all duration-300 hover:-translate-y-1 border border-slate-200 border-t-4 border-t-violet-500">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500">Products Sold</h2>
                    <div class="h-10 w-10 rounded-xl bg-violet-100 text-violet-600 flex items-center justify-center group-hover:scale-110 transition-transform">
                        📦
                    </div>
                </div>
                <p class="text-3xl font-bold text-slate-900">{{ products_sold }}</p>
            </div>

        </div>

        <!-- Back Button -->
        <div class="mt-10 flex justify-center">
            <a href="/dashboard"
               class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-slate-900 text-white font-medium shadow-md hover:bg-slate-700 hover:shadow-lg transition-all duration-200">
                ← Back to Dashboard
            </a>
        </div>

    </div>

</body>
</html>
