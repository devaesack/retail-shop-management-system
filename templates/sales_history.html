{% extends 'base.html' %}

{% block content %}

<h2>Sales History</h2>
<form method="GET">

    <div class="row mb-3">

        <div class="col-md-4">

            <input
                type="date"
                name="sale_date"
                value="{{ selected_date }}"
                class="form-control">

        </div>

        <div class="col-md-2">

            <button
                class="btn btn-primary">

                Search

            </button>

        </div>

    </div>

</form>

<br>

<table
class="table table-bordered table-striped table-hover">

<thead>

<tr class="table-dark">

<th>ID</th>
<th>Customer</th>
<th>Product</th>
<th>Quantity</th>
<th>Total Amount</th>
<th>Date</th>

</tr>

</thead>

<tbody>

{% for sale in sales %}

<tr>

    <td>{{ sale[0] }}</td>

    <td>{{ sale[1] }}</td>

    <td>{{ sale[2] }}</td>

    <td>{{ sale[3] }}</td>

    <td>₹{{ sale[4] }}</td>

    <td>{{ sale[5] }}</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
