{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="card p-4">

        <h2>Add New Product</h2>

        <hr>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Product Name
                </label>

                <input
                type="text"
                name="product_name"
                class="form-control"
                required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Category
                </label>

                <input
                type="text"
                name="category"
                class="form-control"
                required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Price
                </label>

                <input
                type="number"
                step="0.01"
                name="price"
                class="form-control"
                required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Stock
                </label>

                <input
                type="number"
                name="stock"
                class="form-control"
                required>

            </div>

            <button
            class="btn btn-primary">

            Add Product

            </button>

        </form>

    </div>

</div>

{% endblock %}
